<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLOOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --hue: 300;
      --glow: hsl(var(--hue) 92% 62%);
      --hot: hsl(calc(var(--hue) + 128) 95% 58%);
      --ink: #fff8ff;
      --muted: rgba(255, 210, 255, 0.65);
      --panel: rgba(12, 2, 22, 0.52);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050008;
      color: var(--ink);
      font-family: Nunito, "Segoe UI", sans-serif;
      user-select: none;
    }

    body.overlay { background: transparent; }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .veil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      background: radial-gradient(circle at 50% 52%, transparent 42%, rgba(0, 0, 0, 0.42) 100%);
    }

    .hud, .side, .banner, .combo, .bloomed, .settings, .last {
      position: absolute;
      z-index: 8;
      background: var(--panel);
      border: 1px solid hsla(var(--hue), 90%, 70%, 0.42);
      box-shadow: 0 0 28px hsla(var(--hue), 90%, 50%, 0.2);
      border-radius: 28px;
      backdrop-filter: blur(14px) saturate(1.5);
      pointer-events: none;
    }

    .hud {
      top: 20px;
      left: 22px;
      right: 22px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 12px 18px;
    }

    .logo {
      font-family: Audiowide, sans-serif;
      font-size: 22px;
      letter-spacing: 0.18em;
      color: var(--glow);
      text-shadow: 0 0 18px var(--glow), 0 0 40px var(--hot);
    }

    .layer {
      font-size: 12px;
      letter-spacing: 0.22em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .nectar-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .need { color: var(--glow); }

    .track {
      height: 11px;
      border-radius: 99px;
      background: hsla(var(--hue), 80%, 40%, 0.12);
      border: 1px solid hsla(var(--hue), 90%, 70%, 0.35);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--hot), var(--glow), #fff);
      box-shadow: 0 0 16px var(--glow);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: Audiowide, sans-serif;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff3355;
      box-shadow: 0 0 10px #ff3355;
    }

    .status.on .dot {
      background: var(--glow);
      box-shadow: 0 0 12px var(--glow);
    }

    .side {
      top: 108px;
      left: 22px;
      width: 228px;
      padding: 12px 14px 14px;
    }

    .kicker {
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
    }

    .row b { color: var(--glow); }

    .last {
      right: 22px;
      top: 108px;
      width: 150px;
      padding: 10px;
      text-align: center;
    }

    .last img, .last .orb {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      display: block;
      object-fit: cover;
      margin-bottom: 8px;
      border: 2px solid hsla(var(--hue), 90%, 70%, 0.5);
    }

    .last .orb {
      background: radial-gradient(circle at 35% 30%, #fff, var(--glow) 38%, var(--hot) 70%, #120010);
    }

    .folds {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 8;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 0 #000, 0 0 18px var(--glow);
    }

    .folds b {
      display: block;
      font-family: Audiowide, sans-serif;
      font-size: clamp(26px, 4vw, 48px);
      line-height: 0.9;
    }

    .folds span {
      font-size: 11px;
      letter-spacing: 0.4em;
      color: var(--glow);
    }

    .combo {
      top: 38%;
      right: 28px;
      padding: 10px 16px 8px;
      text-align: right;
      opacity: 0;
      transform: translateX(16px);
      transition: 0.18s ease;
    }

    .combo.show { opacity: 1; transform: none; }

    .combo strong {
      display: block;
      font-family: Audiowide, sans-serif;
      font-size: 42px;
      color: var(--hot);
      text-shadow: 0 0 18px var(--hot);
      line-height: 0.9;
    }

    .banner {
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%) translateY(18px);
      width: min(680px, calc(100% - 48px));
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      opacity: 0;
      z-index: 9;
    }

    .banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
      flex: 0 0 auto;
      border: 1px solid var(--glow);
    }

    .who { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
    .name { font-family: Audiowide, sans-serif; font-size: 20px; }
    .meta { font-size: 15px; font-weight: 800; color: var(--glow); }
    .tag {
      margin-left: auto;
      font-family: Audiowide, sans-serif;
      color: var(--hot);
      letter-spacing: 0.1em;
      font-size: 13px;
    }

    .bloomed {
      left: 50%;
      top: 44%;
      transform: translate(-50%, -50%) scale(0.86);
      padding: 22px 40px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      z-index: 12;
    }

    .bloomed.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      transition: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bloomed h2 {
      font-family: Audiowide, sans-serif;
      font-size: clamp(28px, 5vw, 54px);
      color: var(--glow);
      text-shadow: 0 0 24px var(--glow);
    }

    .bloomed p {
      margin-top: 6px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
    }

    .settings-wrap {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      pointer-events: auto;
    }

    .gear {
      width: 42px;
      height: 42px;
      margin-left: auto;
      display: grid;
      place-items: center;
      border: 1px solid hsla(var(--hue), 90%, 70%, 0.45);
      background: var(--panel);
      color: var(--glow);
      cursor: pointer;
      font-size: 18px;
      border-radius: 50%;
    }

    .settings {
      position: static;
      width: 320px;
      padding: 14px;
      margin-top: 8px;
      opacity: 0;
      pointer-events: none;
    }

    body.show-settings .settings,
    .settings-wrap:hover .settings,
    .settings-wrap:focus-within .settings {
      opacity: 1;
      pointer-events: auto;
    }

    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; letter-spacing: 0.08em; text-transform: uppercase; }
    input {
      width: 100%;
      border: 1px solid hsla(var(--hue), 90%, 70%, 0.35);
      background: rgba(20, 6, 32, 0.8);
      color: var(--ink);
      padding: 8px 10px;
      font: 800 14px Nunito, sans-serif;
      outline: none;
      border-radius: 10px;
    }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    button {
      border: 1px solid var(--glow);
      background: var(--glow);
      color: #120018;
      padding: 9px 10px;
      font: 800 13px Nunito, sans-serif;
      letter-spacing: 0.06em;
      cursor: pointer;
      border-radius: 12px;
    }
    button.ghost { background: transparent; color: var(--glow); }
    button.gear { padding: 0; }
    .hint { margin-top: 8px; font-size: 11px; color: var(--muted); line-height: 1.35; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="veil"></div>

  <header class="hud">
    <div>
      <div class="logo">BLOOM</div>
      <div class="layer" id="layerLabel">Layer 01</div>
    </div>
    <div>
      <div class="nectar-top">
        <span>Nectar</span>
        <span class="need" id="needText">0 / 500</span>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Offline</span></div>
  </header>

  <aside class="side">
    <div class="kicker">Gardeners</div>
    <div id="board"><div class="row"><span>Awaiting gifts</span><b></b></div></div>
  </aside>

  <aside class="last">
    <div class="orb" id="lastOrb"></div>
    <img id="lastImg" alt="" style="display:none" />
    <div class="kicker" id="lastLabel">The garden</div>
  </aside>

  <div class="folds" aria-hidden="true">
    <b id="foldNum">6</b>
    <span>FOLDS</span>
  </div>

  <div class="combo" id="combo">
    <div class="kicker" id="comboWho">pulse</div>
    <strong id="comboHits">x1</strong>
    <div class="kicker">combo</div>
  </div>

  <aside class="banner" id="banner">
    <img class="avatar" id="avatar" alt="" />
    <div>
      <div class="who" id="who">@user</div>
      <div class="name" id="displayName">Waiting for gifts</div>
      <div class="meta" id="giftLine">Gift</div>
    </div>
    <div class="tag" id="tag">SEED</div>
  </aside>

  <div class="bloomed" id="bloomed">
    <h2>IT BLOOMED</h2>
    <p id="bloomedSub">A new layer opens</p>
  </div>

  <div class="settings-wrap" id="settings">
    <button class="gear" type="button" title="Settings">⚙</button>
    <section class="settings">
      <div class="kicker">Bloom settings</div>
      <label>WebSocket</label>
      <input id="wsUrl" value="ws://localhost:21213/" />
      <div class="grid2">
        <div>
          <label>Min diamonds</label>
          <input id="minDiamonds" type="number" min="0" value="0" />
        </div>
        <div>
          <label>Layer 1 nectar</label>
          <input id="baseNeed" type="number" min="50" value="500" />
        </div>
      </div>
      <div class="btns">
        <button type="button" id="saveBtn">Save</button>
        <button type="button" class="ghost" id="resetBtn">Reset garden</button>
        <button type="button" id="demoBtn">Demo gift</button>
        <button type="button" class="ghost" id="comboBtn">Demo combo</button>
      </div>
      <p class="hint">D = gift, C = combo, R = reset. ?overlay=1 is transparent for OBS. Gifts feed the kaleidoscope and dye it a new color.</p>
    </section>
  </div>

  <script>
    const DEFAULTS = { wsUrl: "ws://localhost:21213/", minDiamonds: 0, baseNeed: 500 };
    const params = new URLSearchParams(location.search);
    const state = loadState();
    const board = new Map();
    const spirits = [];
    const petals = [];
    const motes = [];

    let ws = null;
    let reconnectTimer = 0;
    let comboHide = 0;
    let bannerHide = 0;
    let blooming = false;
    let canvas, ctx, w = 0, h = 0, last = 0, overlay = false;

    const world = {
      time: 0,
      hue: 300,
      trip: 0.22,
      warp: 0,
      flash: 0,
      spin: 0.22,
      energy: state.energy || 0,
      level: state.level || 1,
      lookX: 0,
      lookY: 0
    };

    const els = {
      status: document.getElementById("status"),
      statusText: document.getElementById("statusText"),
      layerLabel: document.getElementById("layerLabel"),
      needText: document.getElementById("needText"),
      fill: document.getElementById("fill"),
      board: document.getElementById("board"),
      combo: document.getElementById("combo"),
      comboWho: document.getElementById("comboWho"),
      comboHits: document.getElementById("comboHits"),
      banner: document.getElementById("banner"),
      avatar: document.getElementById("avatar"),
      who: document.getElementById("who"),
      displayName: document.getElementById("displayName"),
      giftLine: document.getElementById("giftLine"),
      tag: document.getElementById("tag"),
      bloomed: document.getElementById("bloomed"),
      bloomedSub: document.getElementById("bloomedSub"),
      lastOrb: document.getElementById("lastOrb"),
      lastImg: document.getElementById("lastImg"),
      lastLabel: document.getElementById("lastLabel"),
      settings: document.getElementById("settings"),
      wsUrl: document.getElementById("wsUrl"),
      minDiamonds: document.getElementById("minDiamonds"),
      baseNeed: document.getElementById("baseNeed"),
      foldNum: document.getElementById("foldNum")
    };

    if (params.has("overlay")) {
      document.body.classList.add("overlay");
      overlay = true;
    }
    if (params.has("clean")) els.settings.style.display = "none";
    if (params.has("demo")) setTimeout(() => demoGift(false), 800);

    canvas = document.getElementById("view");
    ctx = canvas.getContext("2d");
    seedMotes();
    fillForm();
    renderHud();
    connect();
    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(loop);

    document.getElementById("saveBtn").onclick = saveSettings;
    document.getElementById("resetBtn").onclick = resetGarden;
    document.getElementById("demoBtn").onclick = () => demoGift(false);
    document.getElementById("comboBtn").onclick = () => demoGift(true);
    window.addEventListener("keydown", onKey);
    els.avatar.addEventListener("error", () => { els.avatar.style.display = "none"; });
    els.lastImg.addEventListener("error", () => { els.lastImg.style.display = "none"; els.lastOrb.style.display = "block"; });

    function loadState() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem("bloom") || localStorage.getItem("lightgrid") || "{}"); } catch {}
      return {
        wsUrl: params.get("ws") || saved.wsUrl || DEFAULTS.wsUrl,
        minDiamonds: num(params.get("min") ?? saved.minDiamonds, DEFAULTS.minDiamonds),
        baseNeed: num(params.get("need") ?? saved.baseNeed, DEFAULTS.baseNeed),
        level: num(saved.level, 1),
        energy: num(saved.energy, 0)
      };
    }

    function persist() {
      localStorage.setItem("bloom", JSON.stringify({
        wsUrl: state.wsUrl,
        minDiamonds: state.minDiamonds,
        baseNeed: state.baseNeed,
        level: world.level,
        energy: world.energy
      }));
    }

    function fillForm() {
      els.wsUrl.value = state.wsUrl;
      els.minDiamonds.value = state.minDiamonds;
      els.baseNeed.value = state.baseNeed;
    }

    function saveSettings() {
      state.wsUrl = els.wsUrl.value.trim() || DEFAULTS.wsUrl;
      state.minDiamonds = Math.max(0, num(els.minDiamonds.value, 0));
      state.baseNeed = Math.max(50, num(els.baseNeed.value, 500));
      persist();
      renderHud();
      connect(true);
    }

    function resetGarden() {
      world.level = 1;
      world.energy = 0;
      world.hue = 300;
      world.trip = 0.22;
      world.warp = 0;
      world.flash = 0;
      world.spin = 0.22;
      spirits.length = 0;
      petals.length = 0;
      board.clear();
      persist();
      renderHud();
      renderBoard();
      els.bloomed.classList.remove("show");
      blooming = false;
    }

    function needFor(level) {
      return Math.round(state.baseNeed * Math.pow(1.5, level - 1));
    }

    function folds() {
      return 6 + Math.min(10, (world.level - 1) * 2);
    }

    function hsl(h, s, l, a) {
      const hue = ((h % 360) + 360) % 360;
      return a == null ? `hsl(${hue} ${s}% ${l}%)` : `hsl(${hue} ${s}% ${l}% / ${a})`;
    }

    function paintTheme() {
      document.documentElement.style.setProperty("--hue", String(Math.round(world.hue)));
      document.documentElement.style.setProperty("--glow", hsl(world.hue, 92, 62));
      document.documentElement.style.setProperty("--hot", hsl(world.hue + 128, 95, 58));
    }

    function renderHud() {
      const need = needFor(world.level);
      els.layerLabel.textContent = `Layer ${String(world.level).padStart(2, "0")}`;
      els.needText.textContent = `${fmt(world.energy)} / ${fmt(need)}`;
      els.fill.style.width = Math.max(0, Math.min(100, (world.energy / need) * 100)) + "%";
      els.foldNum.textContent = String(folds());
      paintTheme();
    }

    function renderBoard() {
      const top = [...board.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4);
      els.board.replaceChildren();
      if (!top.length) {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = "<span>Awaiting gifts</span><b></b>";
        els.board.append(row);
        return;
      }
      top.forEach(([name, n], i) => {
        const row = document.createElement("div");
        row.className = "row";
        const a = document.createElement("span");
        a.textContent = `${i + 1}. ${name}`;
        const b = document.createElement("b");
        b.textContent = fmt(n);
        row.append(a, b);
        els.board.append(row);
      });
    }

    function setConnected(on) {
      els.status.classList.toggle("on", on);
      els.statusText.textContent = on ? "Linked" : "Offline";
    }

    function connect(force) {
      if (ws && (force || ws.readyState > 1)) {
        try { ws.close(); } catch {}
        ws = null;
      }
      if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
      setConnected(false);
      try { ws = new WebSocket(state.wsUrl); }
      catch { scheduleReconnect(); return; }
      ws.onopen = () => { setConnected(true); clearTimeout(reconnectTimer); };
      ws.onclose = () => { setConnected(false); scheduleReconnect(); };
      ws.onerror = () => setConnected(false);
      ws.onmessage = (ev) => {
        let raw;
        try { raw = JSON.parse(ev.data); } catch { return; }
        const msg = unwrap(raw);
        if (normEvent(msg.event) !== "gift") return;
        handleGift(msg.data || {});
      };
    }

    function scheduleReconnect() {
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => connect(), 2000);
    }

    function unwrap(raw) {
      if (!raw || typeof raw !== "object") return { event: "", data: {} };
      if (raw.data && (raw.event || raw.type || raw.eventName)) {
        return { event: raw.event || raw.type || raw.eventName, data: raw.data };
      }
      if (raw.data && raw.data.event) return unwrap(raw.data);
      return { event: raw.event || raw.type || "", data: raw };
    }

    function normEvent(name) {
      return String(name || "").toLowerCase().replace(/[^a-z]/g, "");
    }

    function handleGift(raw) {
      const gift = normalizeGift(raw);
      if (!gift.uniqueId && !gift.nickname) return;
      if (gift.giftType === 1 && !gift.repeatEnd) {
        dye(gift, true);
        world.spin = Math.min(2.4, world.spin + 0.08);
        showCombo(gift);
        burst(28, world.hue, 10);
        return;
      }
      hideComboSoon();
      if (gift.totalDiamonds < state.minDiamonds) return;
      feed(gift);
    }

    function dye(gift, combo) {
      const diamonds = gift.totalDiamonds || gift.diamonds || 1;
      world.hue = (world.hue + (combo ? 16 : 137.5 + Math.min(70, diamonds * 0.3))) % 360;
      world.trip = Math.min(1, world.trip + (combo ? 0.05 : 0.16 + Math.min(0.3, diamonds / 450)));
      world.warp = Math.min(1.8, world.warp + (combo ? 0.1 : 0.32));
      world.flash = combo ? 0.5 : 1;
      paintTheme();
    }

    function feed(gift) {
      dye(gift, false);
      const name = gift.nickname || gift.uniqueId || "soul";
      spirits.push({
        name,
        giftName: gift.giftName,
        uniqueId: gift.uniqueId,
        diamonds: gift.totalDiamonds,
        repeatCount: gift.repeatCount,
        profilePictureUrl: gift.profilePictureUrl,
        hue: world.hue,
        ang: Math.random() * Math.PI * 2,
        rad: Math.max(w, h) * (0.48 + Math.random() * 0.12),
        spin: (Math.random() < 0.5 ? -1 : 1) * (0.7 + Math.random() * 0.8),
        size: 10 + Math.min(28, gift.totalDiamonds / 18)
      });
      world.spin = Math.min(2.6, world.spin + Math.min(0.45, gift.totalDiamonds / 80));
    }

    function absorb(s) {
      applyGift(s);
      burst(s.size * 2.4, s.hue, 18 + Math.min(24, s.diamonds / 12));
    }

    function applyGift(gift) {
      world.energy += gift.diamonds;
      const key = gift.name;
      board.set(key, (board.get(key) || 0) + gift.diamonds);
      persist();
      renderHud();
      renderBoard();
      showBanner(gift);
      if (!blooming && world.energy >= needFor(world.level)) bloomOpen(gift);
    }

    function bloomOpen(gift) {
      blooming = true;
      world.flash = 1;
      world.trip = 1;
      world.hue = (world.hue + 80) % 360;
      els.bloomedSub.textContent = `${gift.name} opened layer ${String(world.level + 1).padStart(2, "0")}`;
      els.bloomed.classList.add("show");
      burst(90, world.hue, 70);
      setTimeout(() => {
        world.level += 1;
        world.energy = 0;
        board.clear();
        persist();
        renderHud();
        renderBoard();
        els.bloomed.classList.remove("show");
        blooming = false;
      }, 2600);
    }

    function showBanner(gift) {
      els.who.textContent = gift.uniqueId ? `@${gift.uniqueId}` : "gardener";
      els.displayName.textContent = gift.name;
      els.giftLine.textContent = gift.repeatCount > 1
        ? `${gift.giftName} ×${gift.repeatCount}  ·  ${fmt(gift.diamonds)} 💎`
        : `${gift.giftName}  ·  ${fmt(gift.diamonds)} 💎`;
      els.tag.textContent = gift.diamonds >= 300 ? "NOVA" : gift.diamonds >= 100 ? "BLOOM" : "SEED";
      if (gift.profilePictureUrl) {
        els.avatar.src = gift.profilePictureUrl;
        els.avatar.style.display = "block";
        els.lastImg.src = gift.profilePictureUrl;
        els.lastImg.style.display = "block";
        els.lastOrb.style.display = "none";
      } else {
        els.avatar.style.display = "none";
        els.lastImg.style.display = "none";
        els.lastOrb.style.display = "block";
      }
      els.lastLabel.textContent = gift.name || "The garden";
      els.banner.classList.add("show");
      clearTimeout(bannerHide);
      bannerHide = setTimeout(() => els.banner.classList.remove("show"), 5600);
    }

    function showCombo(gift) {
      els.comboWho.textContent = gift.nickname || gift.uniqueId;
      els.comboHits.textContent = `x${gift.repeatCount}`;
      els.combo.classList.add("show");
      clearTimeout(comboHide);
    }

    function hideComboSoon() {
      clearTimeout(comboHide);
      comboHide = setTimeout(() => els.combo.classList.remove("show"), 450);
    }

    function normalizeGift(d) {
      const user = d.user || {};
      const giftObj = d.gift || d.giftDetails || {};
      const uniqueId = d.uniqueId || user.uniqueId || d.userName || "";
      const nickname = d.nickname || user.nickname || uniqueId || "Viewer";
      const giftName = d.giftName || giftObj.giftName || giftObj.name || giftObj.gift_name || "Gift";
      const giftType = num(first(d.giftType, giftObj.gift_type, giftObj.giftType), 0);
      const diamondCount = num(first(d.diamondCount, d.diamond_count, giftObj.diamondCount, giftObj.diamond_count), 0);
      const repeatCount = Math.max(1, num(first(d.repeatCount, d.repeat_count, giftObj.repeat_count, giftObj.repeatCount), 1));
      const repeatEnd = isTrue(first(d.repeatEnd, d.repeat_end, giftObj.repeat_end, giftObj.repeatEnd));
      return {
        uniqueId, nickname, giftName, giftType, diamondCount, repeatCount, repeatEnd,
        totalDiamonds: diamondCount * repeatCount,
        profilePictureUrl: d.profilePictureUrl || user.profilePictureUrl || ""
      };
    }

    function first(...vals) { return vals.find((v) => v !== undefined && v !== null); }
    function isTrue(v) { return v === true || v === 1 || v === "1" || v === "true"; }
    function num(v, fallback) { const n = Number(v); return Number.isFinite(n) ? n : fallback; }
    function fmt(n) { return Number(n || 0).toLocaleString("en-US"); }

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
    }

    function seedMotes() {
      motes.length = 0;
      for (let i = 0; i < 70; i++) {
        motes.push({
          a: Math.random() * Math.PI * 2,
          r: 40 + Math.random() * 420,
          s: 0.12 + Math.random() * 0.5,
          sz: 1 + Math.random() * 2.4,
          h: Math.random() * 360
        });
      }
    }

    function burst(radius, hue, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 40 + Math.random() * 180;
        petals.push({
          x: w * 0.5, y: h * 0.52,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 0.7 + Math.random() * 0.7,
          max: 1,
          hue: hue + Math.random() * 50,
          sz: 3 + Math.random() * 7
        });
      }
    }

    function loop(t) {
      if (!last) last = t;
      const dt = Math.min(0.05, (t - last) / 1000);
      last = t;
      world.time += dt;
      world.warp *= Math.pow(0.96, dt * 60);
      world.flash *= Math.pow(0.9, dt * 60);
      world.trip = Math.max(0.18, world.trip - dt * 0.03);
      world.spin += (0.22 + world.trip * 0.5 - world.spin) * Math.min(1, 0.4 * dt);

      if (overlay) ctx.clearRect(0, 0, w, h);
      else {
        ctx.fillStyle = hsl(world.hue + 240, 40, 4, 0.16 + (1 - world.trip) * 0.08);
        ctx.fillRect(0, 0, w, h);
      }

      drawNebula();
      drawMotes(dt);
      drawMandala();
      updateSpirits(dt);
      updatePetals(dt);
      drawFlash();

      const rumble = world.flash * 4 + world.warp * 2;
      canvas.style.transform = `translate(${Math.sin(world.time * 21) * rumble}px, ${Math.cos(world.time * 17) * rumble * 0.4}px)`;
      canvas.style.filter = `saturate(${1.25 + world.trip * 0.9 + world.flash * 0.5}) contrast(${1.05 + world.flash * 0.15})`;
      requestAnimationFrame(loop);
    }

    function drawNebula() {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 4; i++) {
        const cx = w * 0.5 + Math.sin(world.time * 0.25 + i * 1.7) * w * 0.12;
        const cy = h * 0.52 + Math.cos(world.time * 0.2 + i) * h * 0.08;
        const rad = (180 + i * 70) * (1 + world.trip * 0.35);
        const g = ctx.createRadialGradient(cx, cy, 8, cx, cy, rad);
        g.addColorStop(0, hsl(world.hue + i * 48, 100, 62, 0.16 + world.flash * 0.12));
        g.addColorStop(1, "transparent");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawMotes(dt) {
      const cx = w * 0.5, cy = h * 0.52;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      motes.forEach((m) => {
        m.a += m.s * dt * (0.4 + world.spin);
        const x = cx + Math.cos(m.a + world.time * 0.1) * m.r * (0.7 + 0.3 * Math.sin(world.time + m.h));
        const y = cy + Math.sin(m.a + world.time * 0.1) * m.r * 0.62;
        ctx.fillStyle = hsl(world.hue + m.h * 0.2, 90, 70, 0.35);
        ctx.beginPath();
        ctx.arc(x, y, m.sz, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawMandala() {
      const cx = w * 0.5;
      const cy = h * 0.52;
      const n = folds();
      const pulse = 1 + Math.sin(world.time * 3.2) * 0.06 + world.flash * 0.12;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(world.time * world.spin);
      ctx.globalCompositeOperation = "lighter";

      for (let k = 0; k < n; k++) {
        ctx.save();
        ctx.rotate((Math.PI * 2 / n) * k);
        if (k % 2) ctx.scale(-1, 1);
        drawWedge(pulse);
        ctx.restore();
      }

      drawCore(pulse);
      ctx.restore();
    }

    function drawWedge(pulse) {
      const len = Math.min(w, h) * (0.28 + world.trip * 0.1) * pulse;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (let arm = 0; arm < 3; arm++) {
        ctx.beginPath();
        for (let i = 0; i <= 36; i++) {
          const t = i / 36;
          const a = t * 0.42 + arm * 0.08;
          const r = 24 + t * len;
          const wob = Math.sin(t * (7 + arm * 2) + world.time * (2.2 + arm) + world.warp * 4) * (8 + world.trip * 22) * t;
          const x = Math.cos(a) * r + Math.cos(a + Math.PI / 2) * wob;
          const y = Math.sin(a) * r + Math.sin(a + Math.PI / 2) * wob;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = hsl(world.hue + arm * 40 + world.time * 12, 95, 62, 0.55);
        ctx.lineWidth = 2.2 + world.trip * 3.5 + arm;
        ctx.stroke();
      }

      ctx.fillStyle = hsl(world.hue + 70, 100, 64, 0.12 + world.trip * 0.1);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(len * 0.35, len * 0.12, len * 0.72, 8);
      ctx.quadraticCurveTo(len * 0.3, -10, 0, 0);
      ctx.fill();
    }

    function drawCore(pulse) {
      const r = (34 + world.trip * 22 + world.flash * 16) * pulse;
      const g = ctx.createRadialGradient(world.lookX * 8, world.lookY * 8, 4, 0, 0, r * 1.6);
      g.addColorStop(0, "#fff");
      g.addColorStop(0.14, hsl(world.hue + 40, 100, 78));
      g.addColorStop(0.38, hsl(world.hue, 95, 52));
      g.addColorStop(0.7, hsl(world.hue + 200, 80, 18, 0.85));
      g.addColorStop(1, "transparent");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.55, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = hsl(world.hue + 90, 100, 70, 0.7);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.92, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = hsl(world.hue + 220, 50, 8, 0.9);
      ctx.beginPath();
      ctx.arc(world.lookX * 6, world.lookY * 6, r * 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(world.lookX * 6 - 4, world.lookY * 6 - 5, r * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }

    function updateSpirits(dt) {
      const cx = w * 0.5, cy = h * 0.52;
      let lx = 0, ly = 0, nlook = 0;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = spirits.length - 1; i >= 0; i--) {
        const s = spirits[i];
        s.ang += s.spin * dt;
        s.rad -= (48 + world.spin * 36 + Math.min(70, s.diamonds * 0.15)) * dt;
        const x = cx + Math.cos(s.ang) * s.rad;
        const y = cy + Math.sin(s.ang) * s.rad * 0.88;
        lx += (x - cx) / Math.max(40, s.rad);
        ly += (y - cy) / Math.max(40, s.rad);
        nlook += 1;

        const glow = ctx.createRadialGradient(x, y, 1, x, y, s.size * 2.4);
        glow.addColorStop(0, "#fff");
        glow.addColorStop(0.25, hsl(s.hue, 100, 62));
        glow.addColorStop(1, "transparent");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, s.size * 2.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fff";
        ctx.font = `800 ${Math.max(11, Math.min(18, s.size))}px Nunito, sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText(s.name, x, y - s.size - 8);

        if (s.rad < 36) {
          absorb(s);
          spirits.splice(i, 1);
        }
      }
      ctx.restore();
      if (nlook) {
        world.lookX += (lx / nlook - world.lookX) * 0.12;
        world.lookY += (ly / nlook - world.lookY) * 0.12;
      } else {
        world.lookX *= 0.96;
        world.lookY *= 0.96;
      }
    }

    function updatePetals(dt) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = petals.length - 1; i >= 0; i--) {
        const p = petals[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.98;
        p.vy *= 0.98;
        p.life -= dt;
        const a = Math.max(0, p.life / (p.max || 1));
        ctx.fillStyle = hsl(p.hue, 95, 62, a);
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.sz * (1.6 - a), p.sz * a * 1.8, world.time, 0, Math.PI * 2);
        ctx.fill();
        if (p.life <= 0) petals.splice(i, 1);
      }
      ctx.restore();
    }

    function drawFlash() {
      if (world.flash < 0.04) return;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const g = ctx.createRadialGradient(w * 0.5, h * 0.52, 10, w * 0.5, h * 0.52, Math.max(w, h) * 0.7);
      g.addColorStop(0, hsl(world.hue, 100, 72, world.flash * 0.32));
      g.addColorStop(0.45, hsl(world.hue + 70, 100, 55, world.flash * 0.1));
      g.addColorStop(1, "transparent");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
    }

    function demoGift(combo) {
      const names = ["luna", "kai", "nova", "rex", "mira", "zed"];
      const gifts = [
        { giftName: "Rose", diamondCount: 1, giftType: 1 },
        { giftName: "TikTok", diamondCount: 1, giftType: 1 },
        { giftName: "Perfume", diamondCount: 20, giftType: 0 },
        { giftName: "Drama", diamondCount: 100, giftType: 0 },
        { giftName: "Lion", diamondCount: 299, giftType: 0 },
        { giftName: "Galaxy", diamondCount: 1000, giftType: 0 }
      ];
      const user = names[Math.floor(Math.random() * names.length)];
      const gift = gifts[Math.floor(Math.random() * gifts.length)];
      const nick = user[0].toUpperCase() + user.slice(1);
      if (!combo || gift.giftType !== 1) {
        handleGift({
          uniqueId: user, nickname: nick, giftName: gift.giftName, giftType: gift.giftType,
          diamondCount: gift.diamondCount,
          repeatCount: gift.giftType === 1 ? 1 + Math.floor(Math.random() * 14) : 1,
          repeatEnd: true
        });
        return;
      }
      let n = 1;
      const id = setInterval(() => {
        handleGift({
          uniqueId: user, nickname: nick, giftName: gift.giftName, giftType: 1,
          diamondCount: 1, repeatCount: n, repeatEnd: n >= 12
        });
        n += 1;
        if (n > 12) clearInterval(id);
      }, 120);
    }

    function onKey(e) {
      if (e.target && /input|textarea/i.test(e.target.tagName)) return;
      if (e.key === "d" || e.key === "D") demoGift(false);
      if (e.key === "c" || e.key === "C") demoGift(true);
      if (e.key === "r" || e.key === "R") resetGarden();
      if (e.key === "s" || e.key === "S") document.body.classList.toggle("show-settings");
    }
  </script>
</body>
